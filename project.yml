name: Lockin
options:
  bundleIdPrefix: com.cadechanyi
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    DEVELOPMENT_TEAM: 93RYX79RFR
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic

schemes:
  Lockin:
    build:
      targets:
        Lockin: all
    run:
      config: Debug
      storeKitConfigurationPath: ""
  LockinMac:
    build:
      targets:
        LockinMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LockinTests

targets:
  Lockin:
    type: application
    platform: iOS
    sources:
      - path: Lockin
        excludes:
          - Info.plist
          - Info-macOS.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadechanyi.lockin
        PRODUCT_NAME: Lockin
        INFOPLIST_FILE: Lockin/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lockin/Lockin.entitlements
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Lockin/Lockin.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.cadechanyi.lockin
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.cadechanyi.lockin
        com.apple.developer.icloud-services:
          - CloudKit
        # Required for CloudKit silent pushes. Without it the other device only sees
        # changes after a relaunch.
        aps-environment: development
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - target: LockinDeviceActivity
        embed: true
        codesign: true
      - target: LockinShieldConfiguration
        embed: true
        codesign: true
      - target: LockinShieldAction
        embed: true
        codesign: true

  LockinMac:
    type: application
    platform: macOS
    sources:
      - path: Lockin
        excludes:
          - Info.plist
          - Info-macOS.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadechanyi.lockin.mac
        PRODUCT_NAME: Lockin
        INFOPLIST_FILE: Lockin/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Lockin/Lockin-macOS.entitlements
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    # The Mac app is intentionally NOT sandboxed: a sandboxed app cannot quit other apps,
    # which is how Mac blocking works. It also does not use Family Controls (no Mac picker)
    # or an app group (no extensions), so neither entitlement is requested here.
    entitlements:
      path: Lockin/Lockin-macOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.cadechanyi.lockin
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.aps-environment: development
    dependencies: []

  # Logic-only tests (no host app, so no signing / entitlements needed).
  LockinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared/ScheduleEvaluator.swift
      - path: Lockin/Services/GradeCalculator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadechanyi.lockin.tests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"

  LockinDeviceActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LockinDeviceActivity
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadechanyi.lockin.DeviceActivity
        PRODUCT_NAME: LockinDeviceActivity
        INFOPLIST_FILE: LockinDeviceActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: LockinDeviceActivity/LockinDeviceActivity.entitlements
        GENERATE_INFOPLIST_FILE: false
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: LockinDeviceActivity/LockinDeviceActivity.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.cadechanyi.lockin
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework

  LockinShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: LockinShieldConfiguration
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadechanyi.lockin.ShieldConfiguration
        PRODUCT_NAME: LockinShieldConfiguration
        INFOPLIST_FILE: LockinShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: LockinShieldConfiguration/LockinShieldConfiguration.entitlements
        GENERATE_INFOPLIST_FILE: false
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: LockinShieldConfiguration/LockinShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.cadechanyi.lockin
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  LockinShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: LockinShieldAction
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
        includes:
          - AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadechanyi.lockin.ShieldAction
        PRODUCT_NAME: LockinShieldAction
        INFOPLIST_FILE: LockinShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: LockinShieldAction/LockinShieldAction.entitlements
        GENERATE_INFOPLIST_FILE: false
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: LockinShieldAction/LockinShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.cadechanyi.lockin
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
